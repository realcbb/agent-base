# MCP Server 登记表（设计文档 8.1 的文件化最小实现）。
# 工具权限级按 8.2 三级申报：ALLOW 只读放行 / ASK 写入须确认 / DENY 禁登。
# tenants：归属租户（分项目登记）；scope：default 建会话时由网关按租户
# 全量注入会话工作区，optional 只登记不自动注入。
# 注：MCP 进工作区的唯一路径是网关按本表注入；service 装配不种
# default_mcps。config 是框架 mcp_config 的完整 JSON（http_mcp：
# {type, url, headers?, timeout?}；stdio_mcp：{type, command, args?,
# env?, cwd?}），地址等直接写在这里，网关原样透传、不再经 env
# 间接层（2026-11-14 定版）。
mcp_servers:
  - name: demo-tools
    config:
      type: http_mcp
      url: http://mcp-demo:8200/mcp
    owner: agent-base demo
    tenants: [demo-dev]
    scope: default
    tools:
      - name: demo_time
        level: ALLOW
        description: 返回当前时间，只读无副作用。
      - name: demo_note_write
        level: ASK
        description: 向笔记文件追加一条笔记，正式写入，执行前人工确认。
  - name: tenant-a-tools
    config:
      type: http_mcp
      url: http://mcp-demo:8200/mcp
    owner: tenant-a
    tenants: [tenant-a]
    scope: default
    tools:
      - name: demo_time
        level: ALLOW
        description: 返回当前时间，只读无副作用（tenant-a 专属登记的第二实例）。
